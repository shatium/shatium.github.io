<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHATIUM | Essentials & Alta Perfumería</title>
    
    <!-- =========================================
         FUENTES ELEGANTES (Google Fonts)
    ========================================= -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">

    <style>
        /* =========================================
           VARIABLES Y ESTILOS BASE
        ========================================= */
        :root {
            --bg-dark: #000000;
            --bg-light: #f5f5f7;
            --text-light: #f5f5f7;
            --text-dark: #1d1d1f;
            --text-muted-dark: #86868b;
            --text-muted-light: #6e6e73;
            
            --accent-silver: #e2e2e7; 
            --silver-gradient: linear-gradient(135deg, #ffffff 0%, #c7c7cc 45%, #8e8e93 85%, #e5e5ea 100%);
            --silver-border: rgba(226, 226, 231, 0.22);
            --silver-glow: rgba(226, 226, 231, 0.05);
            --gold-luxury: #d4af37;
        }

        * { box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3, h4 {
            font-family: 'Playfair Display', serif;
            margin: 0;
            font-weight: 600;
            letter-spacing: 0.02em;
        }
        
        p { margin: 0; letter-spacing: 0.01em; }

        /* =========================================
           ANIMACIONES PREMIUM
        ========================================= */
        .reveal {
            opacity: 0;
            transform: translateY(45px);
            transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .reveal.active { opacity: 1; transform: translateY(0); }

        @keyframes organicFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        @keyframes organicFloatAlt {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-16px); }
        }

        @keyframes logoPulse {
            0%, 100% { filter: drop-shadow(0 4px 15px rgba(255, 255, 255, 0.05)); }
            50% { filter: drop-shadow(0 4px 25px rgba(255, 255, 255, 0.15)); }
        }

        /* =========================================
           SECCIONES GENERALES
        ========================================= */
        section {
            padding: 110px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        @media (max-width: 768px) { section { padding: 80px 20px; } }

        /* =========================================
           HERO SECTION
        ========================================= */
        .hero {
            min-height: 100vh;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-dark);
            position: relative;
            padding: 40px 20px;
        }

        .hero-brand-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }

        .logo-container {
            width: clamp(100px, 16vw, 150px);
            height: clamp(100px, 16vw, 150px);
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-container img { width: 100%; height: 100%; object-fit: contain; display: block; animation: logoPulse 4s infinite ease-in-out; }
        .hero-divider { width: 45px; height: 1px; background: var(--silver-gradient); margin-bottom: 28px; opacity: 0.6; }

        .hero h1 {
            font-size: clamp(3rem, 8vw, 6.8rem);
            margin-bottom: 14px;
            letter-spacing: 0.08em;
            background: var(--silver-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero h2 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 300;
            font-size: clamp(1.1rem, 3.5vw, 2.2rem);
            color: var(--text-muted-dark);
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        /* =========================================
           CONCEPTOS Y TEXTOS
        ========================================= */
        .concept { background-color: var(--bg-light); color: var(--text-dark); padding-top: 120px; }
        .concept h2, .niche-section h2, .catalog-section h2 { font-size: clamp(2.2rem, 5vw, 4rem); margin-bottom: 30px; }
        .niche-section h2, .catalog-section h2 { background: var(--silver-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .niche-section h2 em { font-style: italic; font-weight: 400; }

        .concept p, .niche-section p, .catalog-section p {
            max-width: 850px; font-size: clamp(1.05rem, 2.8vw, 1.25rem); font-weight: 400; line-height: 1.75; margin-bottom: 25px;
        }
        .concept p { color: var(--text-muted-light); }
        .niche-section p, .catalog-section p { color: var(--text-muted-dark); }
        .concept p span { color: var(--text-dark); font-weight: 600; }
        .niche-section p span, .catalog-section p span { color: var(--accent-silver); font-weight: 600; }

        .highlight-box {
            background-color: rgba(0,0,0,0.03); padding: 28px 32px; border-radius: 14px; margin-top: 20px; max-width: 850px;
            animation: organicFloat 7s ease-in-out infinite; transition: box-shadow 0.4s ease, border-color 0.4s ease;
        }
        .dark-bg .highlight-box {
            background-color: var(--silver-glow); border: 1px solid var(--silver-border); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        /* =========================================
           PRECIOS Y BOTONES DE PROMO
        ========================================= */
        .pricing-wrapper { max-width: 700px; width: 100%; margin: 45px auto 20px auto; }
        .pricing-card {
            background: linear-gradient(180deg, #141416 0%, #0c0c0e 100%); padding: 40px 35px; border-radius: 24px; text-align: left;
            border: 1px solid var(--silver-border); box-shadow: 0 20px 40px rgba(0,0,0,0.5); animation: organicFloat 9s ease-in-out infinite;
        }
        .pricing-card.light { background: #ffffff; border: 1px solid #e5e5ea; box-shadow: 0 15px 35px rgba(0,0,0,0.06); }
        .pricing-card h3 { font-size: clamp(2rem, 4vw, 2.8rem); margin-bottom: 25px; text-align: center; }
        .pricing-card.silver-card h3 { background: var(--silver-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .pricing-card.light h3 { color: #000000; } 
        
        .pricing-grid-internal {
            display: grid; grid-template-columns: 1fr 1fr 1.2fr; gap: 15px; align-items: center;
            border-bottom: 1px solid rgba(226, 226, 231, 0.15); padding: 18px 0; font-family: 'Montserrat', sans-serif; font-size: 1.15rem;
        }
        .pricing-card.light .pricing-grid-internal { border-bottom: 1px solid #e5e5ea; }
        .pricing-grid-internal:last-child { border-bottom: none; padding-bottom: 0; }
        .pricing-header { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted-dark); font-weight: 600; padding-bottom: 10px; border-bottom: 1px solid rgba(226, 226, 231, 0.3); margin-bottom: 5px; }
        .pricing-card.light .pricing-header { color: var(--text-muted-light); border-bottom: 1px solid #d1d1d6; }
        
        .col-size { font-weight: 600; color: var(--text-muted-light); }
        .col-base { font-weight: 600; color: #fff; text-align: center; }
        .col-upgrade { font-weight: 700; text-align: right; color: var(--accent-silver); }
        
        .pricing-card.light .col-size { color: var(--text-muted-light); }
        .pricing-card.light .col-base { color: var(--text-dark); }
        .pricing-card.light .col-upgrade { color: #8e8e93; }

        .promo-link-wrapper { text-align: center; margin-top: 25px; margin-bottom: 40px;}
        .promo-link {
            display: inline-block;
            color: #8e8e93; /* Plateado elegante */
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            font-style: italic;
            text-decoration: none;
            border-bottom: 1px solid rgba(142, 142, 147, 0.4);
            padding-bottom: 3px;
            transition: opacity 0.3s ease, color 0.3s ease;
        }
        .dark-bg .promo-link { color: var(--accent-silver); border-color: rgba(226, 226, 231, 0.3); }
        .promo-link:hover { opacity: 0.7; color: var(--text-dark); }
        .dark-bg .promo-link:hover { color: #fff; }

        .info-sticker {
            background-color: rgba(255, 255, 255, 0.8); border-left: 4px solid #d1d1d6; padding: 15px 20px; border-radius: 0 10px 10px 0;
            max-width: 650px; margin: 0 auto 55px auto; text-align: left; font-size: 0.85rem; line-height: 1.6; color: var(--text-muted-light); font-style: italic; box-shadow: 0 5px 15px rgba(0,0,0,0.03); animation: organicFloatAlt 8s ease-in-out infinite 0.5s;
        }
        .info-sticker.dark-sticker { background-color: rgba(20, 20, 22, 0.9); border-left: 4px solid var(--accent-silver); color: #a1a1a6; box-shadow: 0 5px 20px rgba(0,0,0,0.4); }
        .info-sticker b { font-weight: 600; color: var(--text-dark); }
        .info-sticker.dark-sticker b { color: var(--text-light); }

        /* =========================================
           VITRINA / GALERÍA DE PRODUCTOS
        ========================================= */
        .gallery-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            color: var(--text-dark); /* Color oscuro elegante en fondo claro */
            margin-bottom: 30px;
            font-weight: 600;
        }

        .dark-bg .gallery-title {
            background: var(--silver-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }

        .gallery-container { width: 100%; max-width: 1200px; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 24px; margin-top: 10px; }
        .gallery-wrapper:nth-child(1) .product-card { animation: organicFloat 6s ease-in-out infinite 0s; }
        .gallery-wrapper:nth-child(2) .product-card { animation: organicFloat 7s ease-in-out infinite 1s; }
        .gallery-wrapper:nth-child(3) .product-card { animation: organicFloatAlt 6.5s ease-in-out infinite 0.5s; }
        .gallery-wrapper:nth-child(4) .product-card { animation: organicFloat 7.5s ease-in-out infinite 1.5s; }
        .product-card { background-color: #141416; border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 20px; padding: 30px 24px; display: flex; flex-direction: column; align-items: center; height: 100%; }
